android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx8192m

# Versioning
VERSION_NAME=1.9.1
VERSION_CODE=23

# Kotlin/resource namespace, kept as upstream so the sources stay diffable against it
APP_ID=org.fossify.messages

# Installed package id. Distinct from upstream so this fork is its own app, but kept under the
# "org.fossify." prefix: commons warns the user they are running "a fake version of the app"
# whenever the package name lacks that prefix, on first run and at random thereafter.
APPLICATION_ID=org.fossify.messages.levinium

# Which build of this fork, against the upstream release above. VERSION_NAME and VERSION_CODE are
# left exactly as upstream ships them so syncing does not conflict on them; the fork's own number
# lives here and is folded into the version at build time.
#
# Without it two levinium builds of the same upstream release are indistinguishable once installed
# - same name, same code - so Android offers no update and nothing in the app says which one it is.
LEVINIUM_BUILD=3
