android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx8192m

# Versioning
VERSION_NAME=1.9.1
VERSION_CODE=23

# Kotlin/resource namespace, kept as upstream so the sources stay diffable against it
APP_ID=org.fossify.messages

# Installed package id: this fork's own, in its own namespace.
#
# It used to sit under "org.fossify." because commons calls the app a modded version at random,
# and refuses to open the customization screen at all after a hundred runs, whenever the package
# name lacks that prefix. Those two checks are gone from the commons build this depends on, so the
# app no longer has to live in somebody else's namespace to avoid being called a fake.
APPLICATION_ID=com.levinium.messages

# This fork's own version. It used to be the upstream version with a fork build number appended,
# which said which release the code came from but read like a patch set rather than an app. The
# fork carries enough of its own now to be versioned on its own terms; which upstream release it
# is built on is recorded in VERSION_NAME above and stated in the README.
#
# The code has to keep increasing or Android stops offering updates. The last anchored build was
# 2304 (upstream 23 x 100 + build 4), so the scheme here starts above it: major x 10000 plus minor
# x 100 plus patch, which leaves room for both and never goes backwards.
LEVINIUM_VERSION_NAME=2.1.0
LEVINIUM_VERSION_CODE=20100
